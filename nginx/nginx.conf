events {
    worker_connections 1024;
}

http {
    # 1. Define Rate Limiting Zone
    # Allocate 10MB of memory to store IPs, allow a standard rate of 10 requests per second
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream python_api {
        # Pointing to the Python container named 'app'
        server app:5000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            # 2. Apply Rate Limiting
            # Allow short bursts up to 20 requests, process them without delay
            limit_req zone=api_limit burst=20 nodelay;

            # 3. Standard Proxy Headers
            proxy_pass http://python_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Hide Nginx version for security
            server_tokens off;
        }
    }
}
