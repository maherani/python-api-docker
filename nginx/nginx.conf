events {
    worker_connections 1024;
}

http {
    # Define Rate Limiting Zone (10MB memory, 10 requests per second)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream python_api {
        server app:5000;
    }

    server {
        listen 80;
        server_name api.alborz-dot.com; # Your exact domain name

        # Path for Let's Encrypt ACME challenge validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Other requests are processed normally for now
        location / {
            # Apply Rate Limiting (allow short bursts up to 20 requests)
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://python_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Hide Nginx version for security
            server_tokens off;
        }
    }
}
