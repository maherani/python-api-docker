---
- name: Deploy Python API and Nginx Stack
  hosts: webservers
  become: yes
  vars:
    dest_dir: /opt/python-api-docker

  tasks:
    - name: Ensure application directory exists
      file:
        path: "{{ dest_dir }}"
        state: directory
        mode: '0755'
   # Synchronize project files to the production directory while excluding unnecessary files
    - name: Copy project files to production securely
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../"  # Path to the local project root directory
        dest: "/opt/python-api-docker" # Destination path on the target server
        delete: yes                    # Remove extraneous files from destination
        recursive: yes                 # Copy directories recursively
        exclude:                       # Native Ansible exclude list for cleaner rsync pattern matching
          - ".git"
          - ".github"
          - "docs"
          - "*.md"
          - "tree.txt"
          - "ansible"
          - "grafana_data"
          - "loki_data"
          - "prometheus_data"
      delegate_to: localhost          # Run synchronization locally from the runner

    - name: Set correct permissions for Prometheus data
      file:
        path: "{{ dest_dir }}/prometheus_data"
        state: directory
        owner: "65534"
        group: "65534"
        recurse: yes

    - name: Set correct permissions for Loki data
      file:
        path: "{{ dest_dir }}/loki_data"
        state: directory
        owner: "10001"
        group: "10001"
        recurse: yes

    - name: Deploy stack with 2 application replicas
      command: docker compose up -d --scale app=2
      args:
        chdir: "{{ dest_dir }}"
