name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask psycopg2-binary prometheus_client requests pytest pytest-cov ruff bandit

    - name: Run Linting Check (Ruff)
      run: ruff check app/

    - name: Run Security Analysis (Bandit)
      run: bandit -r app/ -ll

    - name: Run Code Syntax Check
      run: python -m py_compile app/app.py

    - name: Run Application Tests with Coverage
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_HOST: localhost
      run: |
        if [ -d "tests" ]; then pytest --cov=app/; else echo "No tests found."; fi

    - name: Verify Docker Image Build
      run: docker build -t company-api-image:latest .

  # Notice the indentation here! 'deploy' is aligned exactly with 'test-and-build'
  deploy:
    needs: test-and-build
    runs-on: self-hosted
    if: github.ref_name == 'production'

    steps:
    # 1. Checkout repository code
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Sync code to server and set permissions
    - name: Sync Code to /opt and Set Permissions
      run: |
        sudo mkdir -p /opt/python-api-docker
        sudo mkdir -p /opt/python-api-docker
        # Synchronize files to the target directory and exclude unnecessary files
        sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='*.md' \
            --exclude='tree.txt' \
            --exclude='ansible' \
            --exclude='grafana_data' \
            --exclude='loki_data' \
            --exclude='prometheus_data' \
            ./ /opt/python-api-docker/
        cd /opt/python-api-docker

        # Create data directories for monitoring tools
        sudo mkdir -p loki_data prometheus_data grafana_data

        # Set correct ownership for Docker containers
        sudo chown -R 10001:10001 loki_data
        sudo chown -R 65534:65534 prometheus_data
        sudo chown -R 472:472 grafana_data

    # 3. Auto-generate .env file securely
    - name: Generate .env file securely
      run: |
        sudo bash -c 'cat << EOF > /opt/python-api-docker/.env
        DB_USER=${{ secrets.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=${{ secrets.DB_NAME }}
        TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
        EOF'

    # Disable local Nginx to prevent port 80 conflicts
    - name: Disable local Nginx to free port 80
      run: |
        sudo systemctl stop nginx || true
        sudo systemctl disable nginx || true

    # 4. Launch containers with new code
    - name: Launch Container Stack
      run: |
        cd /opt/python-api-docker
        sudo docker compose up --build --force-recreate -d
